name: Build and publish web game

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_download:
        description: Publish a downloadable web build as a GitHub Release
        type: boolean
        default: true
      publish_pages:
        description: Publish the playable website (enable GitHub Pages with Actions first)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Godot and web templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.6.3-stable
          curl -fsSL --retry 2 -o engine.zip "$base/Godot_v4.6.3-stable_linux.x86_64.zip"
          curl -fsSL --retry 2 -o templates.tpz "$base/Godot_v4.6.3-stable_export_templates.tpz"
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  engine.zip' | sha512sum -c -
          echo 'da606b61c10157844f8300172df374472665f95015495cb1a7cd132c40ede404faa96cc1016a4b9662db9909ddea69632c4948b2cd11163438dad4808881fb68  templates.tpz' | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/godot-bin" "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j engine.zip -d "$RUNNER_TEMP/godot-bin"
          mv "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          unzip -jo templates.tpz templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          rm engine.zip templates.tpz
      - name: Import, test and export
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit
          timeout 20 godot --headless --path . --script res://tests/smoke.gd
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          (cd build/web && zip -r ../TDExtract-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: TDExtract-web-download
          path: build/TDExtract-web.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
        with:
          path: build/web

  download:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_download
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TDExtract-web-download
      - name: Publish downloadable prototype
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "web-prototype-$RELEASE_NUMBER" TDExtract-web.zip --target "$RELEASE_COMMIT" --title "TDExtract web prototype $RELEASE_NUMBER" --prerelease --notes "Early playable prototype. Unzip TDExtract-web.zip and serve the folder with an HTTP server; opening index.html directly from disk is unsupported. Android packaging has not been validated."

  website:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
